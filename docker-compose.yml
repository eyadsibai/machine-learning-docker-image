version: '3'
services:
  ml-docker:
    image: eyadsibai/ml-unified:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"  # Jupyter Lab
      - "6006:6006"  # TensorBoard
      - "8787:8787"  # RStudio (if using R)
    volumes:
      # Replace this path with your local workspace directory
      - ./work:/home/jovyan/work
    environment:
      # AWS credentials (optional)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # Default to base environment, users can switch in Jupyter
      - CONDA_DEFAULT_ENV=base
    # For GPU support, uncomment the following:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token=''

# Usage:
# 1. Create a 'work' directory in the same location as this file
# 2. Run: docker-compose up -d
# 3. Access Jupyter at http://localhost:8888
# 4. Select kernel: Python 3.8 (ML-CPU), Python 3.8 (ML-GPU), or R (Stats)
# 
# To activate an environment from command line:
# docker-compose exec ml-docker conda activate ml-cpu
# docker-compose exec ml-docker conda activate ml-gpu
# docker-compose exec ml-docker conda activate r-stats
